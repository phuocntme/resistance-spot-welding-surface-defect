[project]
name = "yolo-sam-backend"
version = "1.0.0"
description = "YOLO + SAM ML backend for Label Studio polygon annotation"
requires-python = ">=3.12"
dependencies = [
    "label-studio-ml>=1.0.9,<2.0",
    "ultralytics>=8.4,<9.0",
    "segment-anything>=1.0",
    "torch>=2.0",
    "opencv-python>=4.8",
    "numpy>=1.26",
    "flask>=1.1,<3.0",
    "gunicorn>=20.1",
    "rq>=1.10",
    "packaging>=23.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
